[package]
name = "fibre-doctor-kit"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
description = "Read-only Celestia Fibre diagnostics and offline reports"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
