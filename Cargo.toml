[package]
name = "ttt-fibre"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Read-only Celestia Fibre diagnostics and offline reports"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
