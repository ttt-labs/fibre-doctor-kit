[package]
name = "doctor-fibre-kit"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Read-only Celestia Fibre diagnostics and offline reports"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
